name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead? (Türkçe de yazabilirsiniz.)
    validations:
      required: true
  - type: input
    attributes:
      label: FingerKit version
      placeholder: "0.1.0"
  - type: input
    attributes:
      label: macOS version and Mac model
      placeholder: "macOS 15.6, MacBook Pro M1"
  - type: textarea
    attributes:
      label: Log
      description: Menu bar icon → "Open log". Paste the last lines here.
      render: text
