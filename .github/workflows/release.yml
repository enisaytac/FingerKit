name: Release

# Bir sürüm etiketi gönderilince (ör. v0.1.0) Apple Silicon + Intel paketini yapar ve GitHub Releases'e koyar.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Test
        run: swift test
      - name: Check version matches tag
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Paket/Info.plist)
          [ "v$VERSION" = "$GITHUB_REF_NAME" ] || { echo "Info.plist says $VERSION but tag is $GITHUB_REF_NAME"; exit 1; }
      - name: Build universal app
        run: ./yap.sh --surum
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          ZIP=build/FingerKit-$VERSION.zip
          SHA=$(shasum -a 256 "$ZIP" | cut -d' ' -f1)
          NOTES=$(awk -v v="$VERSION" '$0 ~ "^## \\[?"v {f=1; next} /^## / {f=0} f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" "$ZIP" --title "FingerKit $VERSION" \
            --notes "$NOTES"$'\n\n'"SHA-256: \`$SHA\`"
